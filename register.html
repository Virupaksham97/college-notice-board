<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration - College Notice Board</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <div class="auth-box">
    <h1>College Notice Board</h1>
    <p class="sub">Create your student account</p>
    <div id="msg" class="msg"></div>
    <form id="form">
      <label for="name">Full Name</label>
      <input type="text" id="name" maxlength="100" autocomplete="name" required>
      <label for="email">Email Address</label>
      <input type="email" id="email" maxlength="150" autocomplete="email" required>
      <label for="password">Password</label>
      <input type="password" id="password" minlength="8" autocomplete="new-password" required>
      <label for="confirm">Confirm Password</label>
      <input type="password" id="confirm" minlength="8" autocomplete="new-password" required>
      <button type="submit">Create Account</button>
    </form>
    <p class="link">Already have an account? <a href="index.html">Login here</a></p>
  </div>
  <script src="js/app.js"></script>
  <script>
    const msg = document.getElementById("msg");
    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      try {
        await api("/api/auth/register", "POST", {
          name: document.getElementById("name").value,
          email: document.getElementById("email").value,
          password: document.getElementById("password").value,
          confirm_password: document.getElementById("confirm").value,
        });
        location.href = "index.html?registered=1";
      } catch (err) { showMsg(msg, err.message); }
    });
  </script>
</body>
</html>
