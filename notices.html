<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Notices - College Notice Board</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top"><h1>🎓 College Notice Board</h1></header>
  <nav class="bar" id="nav"></nav>

  <main class="container">
    <h2>College Notices</h2>
    <p>Search and filter college announcements.</p>

    <form class="filter-box" id="filter">
      <input type="search" id="search" placeholder="Search title or description...">
      <select id="category"><option value="">All Categories</option></select>
      <button type="submit">Search</button>
      <button type="button" class="secondary btn" id="reset">Reset</button>
    </form>

    <div id="msg" class="msg"></div>
    <p>Notices found: <strong id="count">0</strong></p>
    <div id="list"></div>
  </main>

  <script src="js/app.js"></script>
  <script>
    let user;
    const msg = document.getElementById("msg");
    const sel = document.getElementById("category");
    sel.innerHTML += CATEGORIES.map((c) => `<option value="${esc(c)}">${esc(c)}</option>`).join("");

    async function load() {
      const q = new URLSearchParams({
        search: document.getElementById("search").value,
        category: sel.value,
      });
      try {
        const { notices } = await api("/api/notices?" + q);
        document.getElementById("count").textContent = notices.length;
        const today = new Date().toISOString().slice(0, 10);
        document.getElementById("list").innerHTML = notices.length
          ? notices.map((n) => `
            <article class="notice-card">
              <h3>${esc(n.title)}</h3>
              <span class="badge">${esc(n.category)}</span>
              ${user.role === "admin" && n.status === "draft" ? '<span class="badge draft">Draft</span>' : ""}
              ${user.role === "admin" && n.expiry_date && n.expiry_date < today ? '<span class="badge expired">Expired</span>' : ""}
              <p class="content">${esc(n.description)}</p>
              <p class="meta">Posted by: ${esc(n.author || "Unknown")} | Date: ${esc(n.created_at)}${n.expiry_date ? " | Expires: " + esc(n.expiry_date) : ""}</p>
              ${user.role === "admin" ? `
              <div class="actions">
                <a class="btn edit" href="notice_form.html?id=${Number(n.id)}">Edit Notice</a>
                <button class="danger btn" data-del="${Number(n.id)}" data-title="${esc(n.title)}">Delete Notice</button>
              </div>` : ""}
            </article>`).join("")
          : '<div class="empty">No notices found. Try another search or category.</div>';
      } catch (err) { showMsg(msg, err.message); }
    }

    document.getElementById("list").addEventListener("click", async (e) => {
      const id = e.target.dataset.del;
      if (!id) return;
      if (!confirm('Permanently delete "' + e.target.dataset.title + '"?')) return;
      try { await api("/api/notices/" + id, "DELETE"); load(); }
      catch (err) { showMsg(msg, err.message); }
    });

    document.getElementById("filter").addEventListener("submit", (e) => { e.preventDefault(); load(); });
    document.getElementById("reset").addEventListener("click", () => {
      document.getElementById("search").value = ""; sel.value = ""; load();
    });

    (async () => {
      user = await requireUser();
      if (!user) return;
      renderNav(user);
      load();
    })();
  </script>
</body>
</html>
